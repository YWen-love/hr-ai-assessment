            - link "SCAN和JTAG分别是什么？它们之间有什么联系与区别？ SCAN（扫描）技术是集成电路测试领域的一种方法，主要用于边界扫描测试（Boundary Scan）。它是在集成电路设计中引入的一种测试结构，允许测试人员通过在芯片的输入/输出引脚上设置和读取特殊寄存器（边界扫描寄存器，BSR）的内容，来间接测试电路板上的互联和芯片内部功能块。这种方式可以在不接触其他内部节点的情况下测试整个电路板的连接性，极大地提高了测试覆盖率和可诊断性。JTAG（Joint Test Action Group，联合测试行动小组）则是开发并推广边界扫描测试标准的一个组织。 初心不忘产学研的博客 2529" [ref=f17e418] [cursor=pointer]:
