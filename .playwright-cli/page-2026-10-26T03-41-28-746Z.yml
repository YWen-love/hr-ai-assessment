                - text: //pan.quark.cn/s/b84554d4f9e3 本人长期收藏的 config.sys、SMARTDRV.EXE、HIMEM.SYS、diskgen.exe 以及 DOS 的四个核心启动文件 COMMAND.COM、MS-DOS.SYS、IO.SYS，这些都是启动 DOS 所必需的文件。描述如下：IO.SYS 是用于 DOS 环境下控制输入输出的文件，其不可或缺性毋庸置疑。COMMAND.COM 则是 Windows 9X 中的 DOS 外壳程序（SHELL），相较于 DOS 6.22 仅增加了部分内部命令，并无其他显著更新。IO.SYS 对 COMMAND.COM 的处理方式发生了根本性变革，当 Win 9X 在 CONFIG.SYS 中加载 EMM386.EXE 驱动以提供UMB时，COMMAND.COM 的常驻部分会被装入 HMA，而暂驻部分则会被放置在 UMB 中（在 DOS 6.22 中，COMMAND.COM 仅能将其常驻部分装入 HMA），这样的设计为 DOS 程序提供了更大的常规内存空间，同时也避免了频繁地从磁盘读取暂驻部分，从而显著提升了系统性能。当然，如果未加载 EMM386.EXE，系统将不会提供UMB，此时 COMMAND.COM 的暂驻部分只能像 DOS 6.22 那样放置在常规内存的高端区域。DOS 内部命令的程序代码存储于 command.com 文件中，该文件在 DOS 系统启动时
