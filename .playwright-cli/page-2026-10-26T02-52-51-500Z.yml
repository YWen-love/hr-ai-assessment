          - paragraph [ref=f55e177]: 1、
          - paragraph [ref=f55e178]: 通常情况下，一国的利率水平提高，会导致____。
          - paragraph [ref=f55e179]: A.本币汇率上升，外币汇率上升
          - paragraph [ref=f55e180]: B.本币汇率上升，外币汇率下降
          - paragraph [ref=f55e181]: C.本币汇率下降，外币汇率上升
          - paragraph [ref=f55e182]: D.本币汇率下降，外币汇率下降
          - paragraph [ref=f55e183]: 解析：
          - paragraph [ref=f55e184]: 参考答案：B
          - paragraph [ref=f55e185]: "[解析]当利率上升时，信用紧缩，贷款减少，投资和消费减少，物价下降，在一定程度上抑制进口，促进出口，减少外汇需求，增加外汇供给，促使外币汇率下降，本币汇率上升。"
