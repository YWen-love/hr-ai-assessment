          - paragraph [ref=f58e175]: 2026中国工商银行工银科技校园招聘笔试参考题库附答案解析
          - paragraph [ref=f58e176]: 毕业院校：________姓名：________考场号：________考生号：________
          - paragraph [ref=f58e177]: 一、选择题
          - paragraph [ref=f58e178]: 1.仓库内发生火灾时，应首先采取的措施是（）
          - paragraph [ref=f58e179]: A.立即乘坐电梯撤离
          - paragraph [ref=f58e180]: B.用湿毛巾捂住口鼻，弯腰低姿撤离
          - paragraph [ref=f58e181]: C.迅速打开所有门窗通风
          - paragraph [ref=f58e182]: D.用火柴尝试寻找火源位置
          - paragraph [ref=f58e183]: 答案：B
          - paragraph [ref=f58e184]: 解析：火灾时产生大量有毒烟气，会向上蔓延。用湿毛巾捂住口鼻可以过滤部分有毒气体，弯腰低姿可以避开上方浓烟，沿着安全出口标志撤离。乘坐电梯可能因断电被困或遭遇烟囱效应。打开所有门窗会导致空气流通，加速火势蔓延。用火柴寻找火源会引燃可燃物，增加危险。
          - paragraph [ref=f58e185]: "2"
