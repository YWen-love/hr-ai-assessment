.不良贷款率35、面向对象程序设计的三大基本特征包括哪些？A.封装性B.继承性C.多态性D.抽象性E.模块化36、计算机网络中，以下哪些协议属于传输层协议？A.TCPB.IPC.UDPD.HTTPE.FTP37、数据库事务的ACID特性包括以下哪些内容？A.原子性B.一致性C.隔离性D.持久性E.可扩展性38、以下哪些是面向对象编程的基本特征？A.封装B.继承C.多态D.抽象E.循环39、在Linux系统中，以下哪些命令可以用于文件查看？A.catB.lsC.moreD.tailE.rm40、以下哪些算法属于排序算法？A.冒泡排序B.二分查找C.快速排序D.归并排序E.深度优先搜索三、判断题判断下列说法是否正确（共10题）41、在计算机网络中，TCP协议提供的是面向连接的可靠传输服务。A.正确B.错误42、数据库事务的ACID特性包括原子性、一致性、隔离性和持久性四个特征。A.正确B.错误43、在面向对象编程中，封装性是指将数据和操作数据的方法绑定在一起形成类。A.正确B.错误44、HTTP协议默认使用80端口进行通信，HTTPS协议默认使用443端口。A.正确B.错误45、在关系数据库中，主键约束可以为空值且可以重复出现。A.正确B.错误46、数据库事务的ACID特性包括原子性、一致性、隔离性和持久性。A.正确B.错误47、Python中的列表和元组都是可变的数据类型。A.正确B.错误48、在面向对象编程中，封装性是指将数据和操作数据的方法绑定在一起。A.正确B.错误49、操作系统的主要功能包括进程管理、内存管理和文件系统管理。A.正确B.错误50、商业银行的核心资本包括实收资本、资本公积、盈余公积、未分配利润和一般风险准备。A.正确B.错误
            - paragraph [ref=f51e74]: 参考答案及解析1.【参考答案】B【解析】ACID是数据库事务的四个基本特性：A（Atomicity）原子性，C（Consistency）一致性，I（Isolation）隔离性，D（Durability）持久性。一致性确保事务执行前后数据库都处于一致状态，事务必须使数据库从一个一致性状态转换到另一个一致性状态。2.【参考答案】D【解析】TCP（传输控制协议）属于传输层协议，负责提供可靠的端到端数据传输服务。OSI七层模型从下到上依次为：物理层、数据链路层、网络层、传输层、会话层、表示层、应用层。传输层还包括UDP协议。3.【参考答案】B【解析】继承是面向对象编程的三大特性之一，允许子类获得父类的属性和方法。封装是隐藏内部实现细节，多态是同一接口的不同实现，抽象是提取事物的本质特征。继承提高了代码复用性和可维护性。4.【参考答案】C【解析】优先级调度算法可以根据具体实现方式分为抢占式和非抢占式两种。抢占式优先级调度中，当有更高优先级的进程到达时会剥夺当前进程的CPU使用权；非抢占式则需要当前进程主动释放CPU后才进行调度。5.【参考答案】C【解析】单元测试是软件测试的最小层次，主要针对程序中最小的可测试单元（如函数、方法、类）进行验证。目的是验证每个单元是否按预期工作，通常由开发人员编写测试用例，使用白盒测试技术，是软件质量保证的重要环节。6.【参考答案】C【解析】TCP（传输控制协议）是传输层的核心协议，负责提供可靠的端到端数据传输服务。传输层主要功能包括流量控制、差错控制和连接管理，TCP协议正体现了这些特征。7.【参考答案】D【解析】事务的ACID特性包括：原子性（Atomicity）、一致性（Consistency）、隔离性（Isolation）和持久性（Durability）。可靠性不是事务的ACID特性之一。8.【参考答案】B【解析】栈是一种特殊的线性表，遵循后进先出（LIFO）原则，即最后进入的元素最先被取出。队列则是先进先出（FIFO）的特性。9.【参考答案】C【解析】封装是面向对象编程的基本特征之一，主要目的是将数据和操作数据的方法绑定在一起，同时隐藏对象的内部实现细节，只通过公共接口与外界交互。10.【参考答案】C【解析】进程是操作系统进行资源分配和调度的基本单位，拥有独立的内存空间；线程是CPU调度的基本单位，共享所属进程的资源。进程比线程开销更大但隔离性更好。11.【参考答案】D【解析】事务的ACID特性包括原子性（Atomicity）、一致性（Consistency）、隔离性（Isolation）和持久性（Durability），不包括并发性。12.【参考答案】B【解析】封装性是面向对象编程的基本特征之一，通过将数据和操作数据的方法组合在一起，隐藏内部实现细节，只提供必要的接口与外界交互。13.【参考答案】B【解析】栈是一种特殊的线性数据结构，遵循LIFO（LastInFirstOut）原则，即最后进入的元素最先被取出，常用于函数调用、表达式求值等场景。14.【参考答案】B【解析】进程是系统资源分配的基本单位，拥有独立的内存空间；线程是CPU调度的基本单位，共享所属进程的资源，创建和切换开销较小。15.【参考答案】C【解析】TCP（传输控制协议）是传输层的核心协议之一，负责提供可靠的端到端数据传输服务。传输层主要功能包括流量控制、差错控制和连接管理，TCP协议正是在此层实现这些功能。16.【参考答案】B【解析】栈是一种特殊的线性数据结构，采用LIFO（LastInFirstOut）原则，即最后进入的元素最先被访问。栈的典型应用场景包括函数调用、表达式求值等。17.【参考答案】B【解析】第三范式（3NF）要求关系模式中不存在非主属性对候选键的传递函数依赖。第一范式消除重复组，第二范式消除部分依赖，第三范式消除传递依赖。18.【参考答案】B【解析】String类在Java中是不可变类，一旦创建就不能修改其内容。每次对字符串的修改都会产生新的String对象，这种设计保证了字符串的线程安全性和缓存效率。19.【参考答案】C【解析】优先级调度算法根据进程的优先级进行调度，优先级数值最高的进程获得CPU资源。该算法可以是抢占式或非抢占式，适用于实时系统和分时系统的任务调度。20.【参考答案】D【解析】SQL语言主要功能包括数据定义功能（DDL）、数据操作功能（DML）、数据控制功能（DCL）。硬件管理属于系统管理员职责范围，不是SQL语言的核心功能。21.【参考答案】B【解析】OSI模型中表示层负责数据格式转换、数据加密解密、数据压缩等功能，确保数据在不同系统间正确表示。22.【参考答案】B【解析】栈是典型的后进先出（LIFO）数据结构，最后入栈的元素最先出栈，符合题目描述的存储特性。23.【参考答案】C【解析】虚拟内存通过将硬盘空间作为内存扩展，使程序能够使用比实际物理内存更大的地址空间，扩展了可用内存范围。24.【参考答案】B【解析】继承是面向对象编程的核心特性之一，允许子类获得父类的属性和方法，实现代码复用和层次化设计。25.【参考答案】E【解析】事务的ACID特性包括原子性(Atomicity)、一致性(Consistency)、隔离性(Isolation)和持久性(Durability)。原子性确保事务要么全部执行，要么全部不执行；一致性保证事务执行前后数据完整性不变；隔离性确保并发执行的事务互不干扰；持久性保证事务提交后数据的改变永久有效。26.【参考答案】AC【解析】传输层协议主要负责端到端的数据传输。TCP（传输控制协议）和UDP（用户数据报协议）都是传输层协议，其中TCP提供可靠的连接服务，UDP提供无连接的传输服务。IP属于网络层协议，HTTP和FTP属于应用层协议。27.【参考答案】ABCD【解析】ACID是数据库事务的四个基本特性：原子性（Atomicity）指事务必须是原子工作单元，整个执行要么全执行要么全不执行；一致性（Consistency）指事务执行前后数据库必须保持一致性状态；隔离性（Isolation）指并发执行的事务之间不能相互影响；持久性（Durability）指事务执行成功后对数据库的修改是永久性的。28.【参考答案】ABC【解析】面向对象编程的三大基本特征是封装、继承和多态。封装是指将数据和操作数据的方法绑定在一起，隐藏内部实现细节；继承是指子类可以获得父类的属性和方法；多态是指同一个接口可以有不同的实现方式。抽象是面向对象设计的重要思想，但不是基本特征。29.【参考答案】ABCD【解析】cat命令用于连接文件并打印到标准输出，也可查看小文件；more命令用于分页查看文件内容，只能向前翻页；less命令功能更强，可以前后翻页；tail命令用于查看文件末尾内容。rm命令是删除文件命令，不能查看文件内容。30.【参考答案】ABCD【解析】数组是相同类型数据元素的集合，支持随机访问；链表通过指针连接数据元素，支持动态存储分配；栈是后进先出的线性结构；队列是先进先出的线性结构。这些都是基本的数据结构类型。循环是程序控制结构，不是数据结构。31.【参考答案】ABCD【解析】操作风险是指由于内部程序、人员、系统的不完善或失效，或外部事件造成损失的风险。包括内部程序缺陷、员工行为、信息系统故障、外部事件等，而市场利率波动属于市场风险。32.【参考答案】ABCD【解析】数据库管理系统四大核心功能包括：数据定义（DDL）、数据操纵（DML）、数据库运行管理和维护功能。网络安全防护虽重要但不属于DBMS核心功能。33.【参考答案】ABCD【解析】信息系统安全防护主要包括：身份认证、数据加密、访问控制、防火墙等技术措施。人员培训属于安全管理范畴，不是直接技术防护措施。34.【参考答案】ABC【解析】流动性风险指标主要包括：流动性覆盖率（LCR）、净稳定资金比率（NSFR）、存贷比等。资本充足率衡量资本充足性，不良贷款率衡量信用风险。35.【参考答案】ABC【解析】面向对象程序设计三大基本特征是封装性、继承性和多态性。封装将数据和方法组合，继承实现代码复用，多态支持不同实现。抽象和模块化是重要概念但非基本特征。36.【参考答案】AC【解析】传输层主要负责端到端的数据传输，TCP（传输控制协议）和UDP（用户数据报协议）都是传输层协议。IP属于网络层协议
