        - article [ref=f7e178]:
          - generic [ref=f7e180]:
            - heading "1. 投递前的准备：从岗位选择到简历打磨" [level=3] [ref=f7e181]
            - paragraph [ref=f7e182]: 记得去年夏天，我在工行官网看到科技菁英岗的招聘信息时，第一反应是"这个岗位简直是为我量身定做的"。但冷静下来后，我发现需要先解决几个关键问题：岗位方向选择、简历优化和投递策略。
            - paragraph [ref=f7e183]:
              - strong [ref=f7e184]: 岗位选择
              - text: 上，工行科技菁英岗分为多个技术方向。我最终选择了珠海的后端开发岗，主要基于三个考虑：一是珠海的生活成本相对一线城市更低，二是大湾区的发展前景，三是岗位要求与我的技术栈高度匹配。这里建议大家在投递前，一定要仔细研究不同分行的岗位描述，有些分行的技术栈要求会明确写"Java/Spring Cloud"，有些则更偏向大数据方向。
            - paragraph [ref=f7e185]:
              - strong [ref=f7e186]: 简历打磨
              - text: 花了我整整三天时间。我参考了牛客网上多位大神的建议，采用"STAR法则"（情境-任务-行动-结果）来描述
              - generic [ref=f7e187] [cursor=pointer]: 项目
              - text: 经历。比如原来写"参与电商系统开发"，后来改为"主导Spring Cloud微服务架构设计，通过引入Redis缓存使QPS提升300%"。技术栈部分，我把掌握程度分为"精通"、"熟练"和"了解"三个层级，确保不给自己挖坑。
            - blockquote [ref=f7e189]:
              - paragraph [ref=f7e190]: 提示：简历上的每个技术点都可能成为面试问题，我在"熟练使用MySQL"旁边特意标注了"索引优化、事务隔离级别"，这后来果然成为面试官追问的方向。
            - paragraph [ref=f7e191]: 投递渠道我选择了官网直投，时间卡在截止前3天。太早投怕被淹没在简历海里，太晚又担心系统问题。事实证明这个策略很有效，我在投递后第14天收到了笔试通知。
            - heading "2. 笔试备战：三周突击计划" [level=3] [ref=f7e192]
            - paragraph [ref=f7e193]: 收到笔试通知时，距离正式考试还有7天。我立即制定了"3+3+1"复习计划：3天专业知识、3天行测英语、1天全真模拟。
            - paragraph [ref=f7e194]:
              - strong [ref=f7e195]: 专业知识
              - text: 部分覆盖面极广，我的应对策略是：
            - list [ref=f7e196]:
              - listitem [ref=f7e197]: 计算机基础：重点复习操作系统进程线程、网络TCP/IP三次握手
              - listitem [ref=f7e198]: 开发框架：Spring IOC/AOP原理、MyBatis缓存机制
              - listitem [ref=f7e199]: 数据库：MySQL索引原理、Redis持久化方案
              - listitem [ref=f7e200]: 安全法规：《个人信息保护法》要点、等保2.
