                - text: 功能对照你截图里的实现： 管理窗口 单个输入回车添加，或批量粘贴很多链接（自动识别换行、空格、中英文逗号分隔），自动去重 一键读取剪贴板添加 链接列表带勾选框（启用/停用），支持 全部启用/停用、编辑、删除、清空 导入 TXT / JSON、导出 TXT 刷新周期可设置（默认 60 秒 = 1 分钟） 可勾选「下次启动软件时自动打开并刷新」 保存 / 启动刷新 / 保存并启动 / 退出 刷新窗口 所有启用的链接各开一个标签页（真实浏览器，可正常登录、看内容） 工具栏：立即刷新（F5）、暂停/继续、后退、前进、刷新当前页（Ctrl+R）、返回链接管理 状态栏实时显示「刷新周期：1 分钟 | 距下次刷新：00
                - emphasis [ref=f7e251]: ":"
